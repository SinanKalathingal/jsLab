<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMEA College - Undergraduate JS Lab</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="checkbox"] {
            margin-right: 10px;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 30px 0;
        }

        button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background-color: #2980b9;
        }

        .hint {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Undergraduate JavaScript Fundamentals Lab</h2>

        <p>
            Fill out the fields below. Currently, this form is entirely static.
            Your assignment is to bring it to life using JavaScript.
        </p>

        <form id="jsLabForm">

            <div class="form-group">
                <label for="studentName">
                    1. Student Name:
                </label>

                <input type="text" id="studentName" placeholder="Enter your full name">
            </div>


            <div class="form-group">
                <label for="studentAge">
                    2. Age:
                </label>

                <input type="number" id="studentAge" placeholder="Enter your age">
            </div>


            <div class="form-group">
                <label for="isEnrolled">

                    <input type="checkbox" id="isEnrolled">

                    3. Is currently enrolled in the degree program

                </label>
            </div>


            <hr>


            <h3 style="color: #2c3e50;">
                Math & Special Values Tester
            </h3>


            <div class="form-group">

                <label for="numA">
                    4. Value A (Numerator):
                </label>

                <input type="text" id="numA" placeholder="Enter any number">

            </div>


            <div class="form-group">

                <label for="numB">
                    5. Value B (Denominator):
                </label>

                <input type="text" id="numB"
                    placeholder="Try entering 0 here to test division by zero">

            </div>


            <div class="form-group">

                <label for="wordValue">
                    6. Text for Math Operation:
                </label>

                <input type="text" id="wordValue"
                    placeholder="Enter a word (e.g., 'hello') to test invalid math">

            </div>


            <button type="button" id="processBtn">
                Process Data
            </button>

        </form>

    </div>


    <script>

        document.getElementById("processBtn").addEventListener("click", function () {

            // ==================================================
            // PART 2 - TASK 1: POPUP BOX AND CONDITIONAL LOGIC
            // ==================================================

            let userConfirmation = confirm("Are you sure?");


            if (userConfirmation === false) {

                // User clicked Cancel
                alert("Operation cancelled.");

            } else {

                // ==========================================
                // PART 1 - TASK 1: VARIABLES AND STRINGS
                // ==========================================

                let studentName = document.getElementById("studentName").value;

                let studentAge = document.getElementById("studentAge").value;

                let isEnrolled = document.getElementById("isEnrolled").checked;


                let message =
                    "Student Name is " + studentName +
                    ", Age is " + studentAge +
                    ", Enrolled status is " + isEnrolled;


                alert(message);


                // ==========================================
                // PART 1 - TASK 2: TESTING INFINITY
                // ==========================================

                let valueA = document.getElementById("numA").value;

                let valueB = document.getElementById("numB").value;


                let result = valueA / valueB;


                alert("Division Result: " + result);


                // ==========================================
                // PART 1 - TASK 3: TESTING NaN
                // ==========================================

                let textValue = document.getElementById("wordValue").value;


                let textResult = textValue / 2;


                alert("Text Division Result: " + textResult);


                // ==========================================
                // PART 1 - TASK 4: SCIENTIFIC NOTATION
                // ==========================================

                let largeNumber = 4.25e+6;

                let smallNumber = 4.25e-6;


                alert(
                    "Large Number: " + largeNumber +
                    "\nSmall Number: " + smallNumber
                );


                // ==========================================
                // PART 1 - TASK 5: DOCUMENT OUTPUT
                // ==========================================

                document.write(
                    "Task 2 - Division Result: " +
                    result +
                    "<br>"
                );


                document.write(
                    "Task 3 - Text Division Result: " +
                    textResult +
                    "<br>"
                );


                document.write(
                    "Task 4 - Large Number: " +
                    largeNumber +
                    "<br>"
                );


                document.write(
                    "Task 4 - Small Number: " +
                    smallNumber +
                    "<br>"
                );


                // ==========================================
                // PART 2 - TASK 2: ARRAYS AND OUTPUT
                // ==========================================

                let favoriteSubjects = [
                    "JavaScript",
                    "Web Development",
                    "Java"
                ];


                for (let subject of favoriteSubjects) {

                    document.write(subject + "<br>");

                }


                // ==========================================
                // PART 2 - TASK 3: STANDARD FOR LOOP
                // ==========================================

                let numberOfTimes = Number(valueA);


                for (
                    let i = 0;
                    i < numberOfTimes;
                    i++
                ) {

                    document.write(studentName + "<br>");

                }

            }

        });

    </script>

</body>

</html>
